name: Backend CI/CD

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'backend/**'
  pull_request:
    branches: [ main ]
    paths:
      - 'backend/**'

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'
    
    - name: Restore dependencies
      run: dotnet restore backend/DrugInteractionAPI/DrugInteractionAPI.csproj
    
    - name: Build
      run: dotnet build backend/DrugInteractionAPI/DrugInteractionAPI.csproj --no-restore --configuration Release
    
    - name: Run tests
      run: dotnet test backend/DrugInteractionAPI.Tests/DrugInteractionAPI.Tests.csproj --no-build --verbosity normal || echo "No tests found"
  
  docker-build:
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Login to Azure Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ secrets.ACR_LOGIN_SERVER }}
        username: ${{ secrets.ACR_USERNAME }}
        password: ${{ secrets.ACR_PASSWORD }}
    
    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: ./backend
        push: true
        tags: ${{ secrets.ACR_LOGIN_SERVER }}/drug-interaction-api:${{ github.sha }},${{ secrets.ACR_LOGIN_SERVER }}/drug-interaction-api:latest
        cache-from: type=registry,ref=${{ secrets.ACR_LOGIN_SERVER }}/drug-interaction-api:buildcache
        cache-to: type=registry,ref=${{ secrets.ACR_LOGIN_SERVER }}/drug-interaction-api:buildcache,mode=max
  
  deploy-to-azure:
    runs-on: ubuntu-latest
    needs: docker-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
    - name: Azure Login
      uses: azure/login@v1
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}
    
    - name: Deploy to Azure App Service
      uses: azure/webapps-deploy@v3
      with:
        app-name: ${{ secrets.AZURE_APP_NAME }}
        images: ${{ secrets.ACR_LOGIN_SERVER }}/drug-interaction-api:${{ github.sha }}